<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guessify — solo solve chart mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #323437;
      --main: #e2b714;
      --text: #d1d0c5;
      --sub: #646669;
      --sub-alt: #2c2e31;
      --font: "Lexend Deca", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sub);
    }
    .card {
      width: min(420px, 100%);
      background: var(--sub-alt);
      border-radius: 12px;
      padding: 18px 16px 20px;
    }
    .heading {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sub);
    }
    .chart {
      width: 100%;
      height: auto;
      display: block;
    }
    .grid { stroke: color-mix(in srgb, var(--sub) 28%, transparent); stroke-width: 1; }
    .axis {
      fill: var(--sub);
      font-size: 9px;
      font-family: var(--font);
    }
    .line {
      fill: none;
      stroke: var(--main);
      stroke-width: 2.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
    }
    .line.is-drawn { stroke-dashoffset: 0; transition: stroke-dashoffset 0.9s ease-out; }
    .dot { fill: var(--main); opacity: 0; }
    .ring {
      fill: none;
      stroke: var(--main);
      stroke-width: 1.25;
      opacity: 0;
    }
    .is-drawn .dot,
    .is-drawn .ring {
      opacity: 1;
      transition: opacity 0.25s ease-out 0.55s;
    }
    .note {
      width: min(420px, 100%);
      font-size: 12px;
      color: var(--sub);
      line-height: 1.5;
      margin: 0;
    }
    code { color: var(--text); }
  </style>
</head>
<body>
  <h1>solo solve chart mock</h1>

  <div class="card">
    <h2 class="heading">Your solves</h2>
    <!--
      Matches proposed GameOverStats constants:
      W=320 H=168
      PAD={ t:16, r:12, b:26, l:40 }
      DOT_R=3 RING_R=6
      axis: max@16 mid@58 0@100 X@142
    -->
    <svg id="chart" class="chart" viewBox="0 0 320 168" role="img" aria-label="Solve times with misses on bottom X band">
      <line class="grid" x1="40" x2="308" y1="16" y2="16" />
      <text class="axis" x="26" y="19" text-anchor="end">16s</text>

      <line class="grid" x1="40" x2="308" y1="58" y2="58" />
      <text class="axis" x="26" y="61" text-anchor="end">8.0s</text>

      <line class="grid" x1="40" x2="308" y1="100" y2="100" />
      <text class="axis" x="26" y="103" text-anchor="end">0.0s</text>

      <line class="grid" x1="40" x2="308" y1="142" y2="142" />
      <text class="axis" x="26" y="145" text-anchor="end">X</text>

      <text class="axis" x="40" y="162" text-anchor="middle">R1</text>
      <text class="axis" x="107" y="162" text-anchor="middle">R2</text>
      <text class="axis" x="174" y="162" text-anchor="middle">R3</text>
      <text class="axis" x="241" y="162" text-anchor="middle">R4</text>
      <text class="axis" x="308" y="162" text-anchor="middle">R5</text>

      <!--
        7.8s → 59.05, miss → 142, 16s → 16, 4.2s → 77.95
      -->
      <g id="series">
        <path
          class="line"
          d="M40,59.05 L107,142 L174,16 L241,77.95 L308,142"
        />
        <circle class="ring" cx="40" cy="59.05" r="6" />
        <circle class="dot" cx="40" cy="59.05" r="3" />
        <circle class="ring" cx="107" cy="142" r="6" />
        <circle class="dot" cx="107" cy="142" r="3" />
        <circle class="ring" cx="174" cy="16" r="6" />
        <circle class="dot" cx="174" cy="16" r="3" />
        <circle class="ring" cx="241" cy="77.95" r="6" />
        <circle class="dot" cx="241" cy="77.95" r="3" />
        <circle class="ring" cx="308" cy="142" r="6" />
        <circle class="dot" cx="308" cy="142" r="3" />
      </g>
    </svg>
  </div>

  <p class="note">
    Open via Vite: <code>/mocks/solve-chart.html</code><br />
    Matches live <code>GameOverStats</code> chart: PAD t16/r12, DOT_R 3, draw-on animation.
  </p>

  <script>
    requestAnimationFrame(() => {
      document.querySelector(".line")?.classList.add("is-drawn");
      document.getElementById("series")?.classList.add("is-drawn");
    });
  </script>
</body>
</html>
